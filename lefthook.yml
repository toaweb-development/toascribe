# GIT_STANDARD_2026 "Enforcement". Install once per clone: pnpm exec lefthook install
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# One command, not two in parallel: until the Nuxt apps read the shared packages from src/ like the rest, their lint and
# typecheck scripts both build those packages into dist/, and two builds at once would write the same files.
pre-commit:
  commands:
    lint-and-typecheck:
      run: pnpm lint && pnpm typecheck

pre-push:
  scripts:
    'protect-main.sh':
      runner: bash
      use_stdin: true # pre-push gets the refs on stdin; without this lefthook hangs
