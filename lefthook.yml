# Optional (GIT_STANDARD_2026 «Hooks — ingen påkrevd»): no hook is required, scripts/release.sh is the gate. Install once per
# clone if you want it: pnpm exec lefthook install
#
# protect-main.sh refuses a force push to main, deleting main, and moving or deleting a v* tag.
pre-push:
  scripts:
    'protect-main.sh':
      runner: bash
      use_stdin: true # pre-push gets the refs on stdin; without this lefthook hangs
