packages:
  - apps/*
  - packages/*
  - themes/*
  - cli

# Script convention (TYPESCRIPT_STANDARD_2026 §7, §14): every workspace package defines all four
# scripts, `lint`, `typecheck`, `test` and `build`, because the root gate runs
# `pnpm -r lint`, `pnpm -r typecheck`, `pnpm -r test` and `pnpm -r build` (all inside `pnpm check`) without --if-present.
# pnpm falls back to running a missing `lint`/`typecheck`/`build` as a shell command and fails.
# A package with nothing to test uses `vitest run --passWithNoTests`; one with nothing to
# lint or build uses an `echo` that says why. `pnpm -r` skips the workspace root.

# Lint, typecheck and test read the workspace libraries (shared, db, ...) from src/, so no package builds a library first and
# `pnpm -r` may run packages in parallel. The libraries list a "source" export condition and tsconfig.base.json sets
# customConditions; Vitest sets ssr.resolve.conditions; the Nuxt packages cannot use the condition (Nuxt UI's own
# dependencies export one too), so packages/nuxt-base aliases each library to its src/index.ts instead. Node and the
# images still run the compiled dist/ (api, worker, cli); only the `dev` scripts of the api and worker build the
# libraries first. Nothing runs a build that writes into a dist/ another process reads, so there is no concurrency limit.

# One version per dependency across the workspace (TYPESCRIPT_STANDARD_2026 §7).
# Packages write "catalog:" and never carry their own version.
# Versions verified against the npm registry 2026-10-20 (`npm view <pkg> version`).
catalog:
  # Language and tooling
  typescript: ~6.0.3 # 6.0 only: typescript-eslint and vue-tsc need the compiler API (7 has none until 7.1)
  '@types/node': ^26.6.5 # matches the Node 24 LTS floor
  eslint: ^10.13.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.0
  '@nuxt/eslint': ^1.17.0
  jiti: ^2.7.0
  prettier: ^3.9.10
  lefthook: ^2.2.2
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4

  # Tests
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  '@playwright/test': ^1.64.1

  # Server
  hono: ^4.13.13
  '@hono/node-server': ^2.1.5
  '@hono/zod-openapi': ^1.6.3
  zod: ^4.6.7
  drizzle-orm: ^0.45.4 # 0.45 is `latest`; 1.0 is beta only, do not use
  drizzle-kit: ^0.31.11
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  pg-boss: ^12.38.0
  pino: ^10.4.0
  pino-pretty: ^13.2.0

  # Frontend (NUXT_VUE_STANDARD_2026)
  nuxt: ^4.6.2
  '@nuxt/ui': ^4.12.0
  vue: ^3.5.44
  vue-tsc: ^3.3.13
  '@nuxtjs/i18n': ^10.6.0 # screen text goes through i18n from the start (bokmål only for now); 10.x supports Nuxt 4
  '@iconify-json/lucide': ^1.2.147 # Nuxt UI's default icon set, served from the build instead of api.iconify.design
  tailwindcss: ^4.3.3 # Nuxt UI's peer; the module registers @tailwindcss/vite itself

# Dependency build scripts are denied unless listed (DEPENDENCIES_2026 / supply-chain hygiene).
# lefthook's postinstall runs `lefthook install`, which writes git hooks: that is a per-clone,
# owner-run step (`pnpm exec lefthook install`), so its script stays denied.
# esbuild (pulled in by drizzle-kit, a devDependency of @toascribe/db): its postinstall only verifies
# the platform binary, which pnpm already installs as an optional dependency (@esbuild/<platform>).
# drizzle-kit generate works without it, so the script stays denied.
# unrs-resolver (eslint-import-resolver chain of @nuxt/eslint): its postinstall only falls back to
# downloading the platform binding, which pnpm already installs as the optional @unrs/resolver-binding-<platform>.
# vue-demi (a @vueuse dependency of Nuxt UI): its postinstall only switches the build for Vue 2; the
# shipped default is the Vue 3 build, which is what the Nuxt apps use.
allowBuilds:
  lefthook: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.147'

# Documented exceptions for `pnpm audit --prod --audit-level high` (SECURITY_STANDARD_2026 §9: ID, reason, review date).
# Both advisories are High, have no patched version, and come from nitropack, the bundler inside `nuxi build`:
#   GHSA-86w9-cpqp-85rv  node-forge <= 1.4.0  (via nitropack > listhen)
#   GHSA-vfj7-8cjw-p6xm  braces <= 3.0.3      (via nitropack > globby > micromatch)
# Neither package is in any runtime image: Nitro bundles only what the server imports, and a `find` over the
# built site, admin and api images finds no node-forge, braces, listhen or nitropack (checked 2026-10-20).
# audit.yml fails when the review date below has passed. Re-check `pnpm audit --prod` then: remove an entry as soon as a
# patched version exists, and extend the date only after looking again.
# audit-exceptions-review-by: 2026-11-20
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
