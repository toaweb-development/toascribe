packages:
  - apps/*
  - packages/*
  - themes/*
  - cli

# Script convention (TYPESCRIPT_STANDARD_2026 §7, §14): every workspace package defines all four
# scripts, `lint`, `typecheck`, `test` and `build`, because the root gate runs
# `pnpm -r lint`, `pnpm -r typecheck`, `pnpm -r test` and `pnpm -r build` (all inside `pnpm check`) without --if-present.
# pnpm falls back to running a missing `lint`/`typecheck`/`build` as a shell command and fails.
# A package with nothing to test uses `vitest run --passWithNoTests`; one with nothing to
# lint or build uses an `echo` that says why. `pnpm -r` skips the workspace root.

# Lint, typecheck and test read the workspace libraries (shared, db, ...) from src/, so no package builds a library first and
# `pnpm -r` may run packages in parallel. The libraries list a "source" export condition and tsconfig.base.json sets
# customConditions; Vitest sets ssr.resolve.conditions; the Nuxt packages cannot use the condition (Nuxt UI's own
# dependencies export one too), so packages/nuxt-base aliases each library to its src/index.ts instead. Node and the
# images still run the compiled dist/ (api, worker, cli); only the `dev` scripts of the api and worker build the
# libraries first. Nothing runs a build that writes into a dist/ another process reads, so there is no concurrency limit
# for lint, typecheck and build (`workspaceConcurrency` is not set). Only the root `test` script passes
# `--workspace-concurrency=1`: the database tests of db, api, worker and cli create the cluster-wide roles toascribe_owner and
# toascribe_app and queue behind one server-wide advisory lock, so run in parallel the last package waits past its hook
# timeout. One package at a time keeps the timeouts short enough to catch a real hang; files inside a package still run in parallel.

# One version per dependency across the workspace (TYPESCRIPT_STANDARD_2026 §7).
# Packages write "catalog:" and never carry their own version.
# Versions verified against the npm registry 2026-10-20 (`npm view <pkg> version`).
catalog:
  # Language and tooling
  typescript: ~6.0.3 # 6.0 only: typescript-eslint and vue-tsc need the compiler API (7 has none until 7.1)
  '@types/node': ^24.19.2 # matches the Node 24 LTS floor
  eslint: ^10.13.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.0
  '@nuxt/eslint': ^1.17.0
  jiti: ^2.7.0
  prettier: ^3.9.10
  lefthook: ^2.2.2

  # Tests
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  '@playwright/test': ^1.64.1
  '@axe-core/playwright': ^4.14.0 # axe-core checks with the WCAG 2.2 AA tags in the admin's end-to-end run (apps/admin/e2e)
  axe-core: ~4.14.0 # the same checks on the HTML of each block view, in packages/block-views' unit tests (the version @axe-core/playwright uses)
  jsdom: ^30.1.3 # the DOM those unit tests run axe in (axe supports JSDOM, without color-contrast)

  # Server
  hono: ^4.13.13
  '@hono/node-server': ^2.1.5
  '@hono/zod-openapi': ^1.6.3
  zod: ^4.6.7
  drizzle-orm: ^0.45.4 # 0.45 is `latest`; 1.0 is beta only, do not use
  drizzle-kit: ^0.31.11
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  pg-boss: ^12.38.0
  pino: ^10.4.0
  pino-pretty: ^13.2.0
  '@node-rs/argon2': ^2.2.2 # argon2id password hashing (typescript §12); prebuilt N-API binaries incl. musl, no install script
  bcryptjs: ^3.0.3 # verifies imported WordPress bcrypt hashes ($2y$, $wp$2y$); pure JS, no build script, used once per account
  nodemailer: ^10.1.7 # sends the e-mail jobs over SMTP; ships its own types (no @types/nodemailer); pure JS
  undici: ^8.12.3 # the Agent whose connect.lookup checks every resolved address, for the SSRF-safe client (packages/http)
  ipaddr.js: ^2.5.0 # classifies addresses (range() === 'unicast') for the same client
  otpauth: ^9.5.2 # TOTP (RFC 6238) for the second factor: one dependency (@noble/hashes), synchronous, window tolerance returns the matched step
  uqr: ^0.1.3 # renders the otpauth:// URI as an SVG QR code on the server; zero dependencies, typed
  file-type: ^22.2.0 # finds an upload's type from its bytes, not its name (K-125); MIT, ESM, covers images, audio, video, PDF, OOXML and ODF (verified 2026-10-26)
  image-size: ^2.0.4 # reads an image's width and height from its header, so the pixel limit refuses a decompression bomb before anything decodes it (K-125); no dependencies
  sharp: ^0.35.5 # image sizes and edits in the worker only (PLAN «Besluttet», M1.2); 0.35.5 is the first release clear of the libvips, libheif and librsvg advisories; prebuilt for linux musl x64/arm64, no build script

  # Frontend (NUXT_VUE_STANDARD_2026)
  nuxt: ^4.6.2
  '@nuxt/ui': ^4.12.0
  vue: ^3.5.44
  vue-tsc: ^3.3.13
  '@nuxtjs/i18n': ^10.6.0 # screen text goes through i18n from the start (bokmål only for now); 10.x supports Nuxt 4
  '@iconify-json/lucide': ^1.2.147 # Nuxt UI's default icon set, served from the build instead of api.iconify.design
  tailwindcss: ^4.3.3 # Nuxt UI's peer; the module registers @tailwindcss/vite itself
  ioredis: ^5.11.1 # the site's data cache in Valkey when several instances share it (PLAN «Cache og invalidering»); the major Nitro itself uses
  smol-toml: ^1.9.1 # reads toascribe.toml (PLAN: the theme is chosen there) in apps/site's nuxt.config; TOML has rules a hand parser would get wrong
  tar: ^7.5.22 # reads a backup archive entry by entry on restore (M1.7), so each path is checked before anything is written; 7.5.22 has every fix up to CVE-2026-73566
  # OpenTelemetry (M1.8, K-298): optional, loaded only when OTEL_EXPORTER_OTLP_ENDPOINT is set. The 3.x SDK packages and the 0.300
  # experimental line pin each other exactly, so they are bumped together (verified 2026-10-28 against the npm tarballs).
  '@opentelemetry/api': 1.10.0
  '@opentelemetry/sdk-node': 0.300.0
  '@opentelemetry/exporter-trace-otlp-http': 0.300.0
  '@opentelemetry/exporter-metrics-otlp-http': 0.300.0
  '@opentelemetry/instrumentation': 0.300.0
  '@opentelemetry/instrumentation-http': 0.300.0
  '@opentelemetry/instrumentation-pg': 0.77.0
  '@opentelemetry/sdk-trace': 3.0.0
  '@opentelemetry/sdk-metrics': 3.0.0
  '@opentelemetry/resources': 3.0.0
  ofetch: ^1.5.1 # the fetch that Nuxt's $fetch is built on; nuxt-base's tests run the API client on the real one, not a stand-in
  nuxt-security: ^2.6.0 # the nonce-based CSP of the site and the admin (nuxt-base) and security headers (K-314): a per-request nonce on Nuxt's inline scripts is what a static header cannot give

  # The block editor prototype (M0.6, docs/decisions/0001-editor-model.md). TipTap 3.32.0 (`latest`, published 2026-10-13,
  # checked against the npm registry 2026-10-25) gives each text block its own ProseMirror instance for inline formatting;
  # @tiptap/vue-3 is its official Vue 3 binding and pins @tiptap/core and @tiptap/pm to the exact same version, so every TipTap
  # package is pinned to one version here and moves together. No StarterKit and no UndoRedo: the editor's own model holds the one
  # history, and only the nodes and marks the block format allows are loaded (document, paragraph, text, hard break, bold,
  # italic, code, link).
  '@tiptap/core': 3.32.0
  '@tiptap/pm': 3.32.0
  '@tiptap/vue-3': 3.32.0
  '@tiptap/extension-document': 3.32.0
  '@tiptap/extension-paragraph': 3.32.0
  '@tiptap/extension-text': 3.32.0
  '@tiptap/extension-hard-break': 3.32.0
  '@tiptap/extension-bold': 3.32.0
  '@tiptap/extension-italic': 3.32.0
  '@tiptap/extension-code': 3.32.0
  '@tiptap/extension-link': 3.32.0

# Dependency build scripts are denied unless listed (DEPENDENCIES_2026 / supply-chain hygiene).
# lefthook's postinstall runs `lefthook install`, which writes git hooks: that is a per-clone,
# owner-run step (`pnpm exec lefthook install`), so its script stays denied.
# esbuild (pulled in by drizzle-kit, a devDependency of @toascribe/db): its postinstall only verifies
# the platform binary, which pnpm already installs as an optional dependency (@esbuild/<platform>).
# drizzle-kit generate works without it, so the script stays denied.
# unrs-resolver (eslint-import-resolver chain of @nuxt/eslint): its postinstall only falls back to
# downloading the platform binding, which pnpm already installs as the optional @unrs/resolver-binding-<platform>.
# vue-demi (a @vueuse dependency of Nuxt UI): its postinstall only switches the build for Vue 2; the
# shipped default is the Vue 3 build, which is what the Nuxt apps use.
allowBuilds:
  lefthook: false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.147'

# Documented exceptions for `pnpm audit --prod --audit-level high` (SECURITY_STANDARD_2026 §9: ID, reason, review date).
# Both advisories are High, have no patched version, and come from nitropack, the bundler inside `nuxi build`:
#   GHSA-86w9-cpqp-85rv  node-forge <= 1.4.0  (via nitropack > listhen)
#   GHSA-vfj7-8cjw-p6xm  braces <= 3.0.3      (via nitropack > globby > micromatch)
# Neither package is in any runtime image: Nitro bundles only what the server imports, and a `find` over the
# built site, admin and api images finds no node-forge, braces, listhen or nitropack (checked 2026-10-20).
# scripts/audit.sh (run by scripts/release.sh) fails when the review date below has passed. Re-check `pnpm audit --prod` then: remove an entry as soon as a
# patched version exists, and extend the date only after looking again.
# audit-exceptions-review-by: 2026-11-20
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
