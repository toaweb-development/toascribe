packages:
  - apps/*
  - packages/*
  - themes/*
  - cli

# Script convention (TYPESCRIPT_STANDARD_2026 §7, §14): every workspace package defines all four
# scripts, `lint`, `typecheck`, `test` and `build`, because the root gate runs
# `pnpm -r lint && pnpm -r typecheck && pnpm -r test && pnpm -r build` without --if-present.
# pnpm falls back to running a missing `lint`/`typecheck`/`build` as a shell command and fails.
# A package with nothing to test uses `vitest run --passWithNoTests`; one with nothing to
# lint or build uses an `echo` that says why. `pnpm -r` skips the workspace root.

# One version per dependency across the workspace (TYPESCRIPT_STANDARD_2026 §7).
# Packages write "catalog:" and never carry their own version.
# Versions verified against the npm registry 2026-10-20 (`npm view <pkg> version`).
catalog:
  # Language and tooling
  typescript: ~6.0.3 # 6.0 only: typescript-eslint and vue-tsc need the compiler API (7 has none until 7.1)
  '@types/node': ^24.19.2 # matches the Node 24 LTS floor
  eslint: ^10.13.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.0
  '@nuxt/eslint': ^1.17.0
  jiti: ^2.7.0
  prettier: ^3.9.10
  lefthook: ^2.2.2
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4

  # Tests
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  '@playwright/test': ^1.64.1

  # Server
  hono: ^4.13.13
  '@hono/node-server': ^2.1.5
  '@hono/zod-openapi': ^1.6.3
  zod: ^4.6.7
  drizzle-orm: ^0.45.4 # 0.45 is `latest`; 1.0 is beta only, do not use
  drizzle-kit: ^0.31.11
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  pg-boss: ^12.38.0
  pino: ^10.4.0
  pino-pretty: ^13.2.0

  # Frontend (NUXT_VUE_STANDARD_2026)
  nuxt: ^4.6.2
  '@nuxt/ui': ^4.12.0
  vue: ^3.5.44
  vue-tsc: ^3.3.13

# Dependency build scripts are denied unless listed (DEPENDENCIES_2026 / supply-chain hygiene).
# lefthook's postinstall runs `lefthook install`, which writes git hooks: that is a per-clone,
# owner-run step (`pnpm exec lefthook install`), so its script stays denied.
allowBuilds:
  lefthook: false
