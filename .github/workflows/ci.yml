# Checks on every pull request and every push to main (DEPENDENCIES_2026 «GitHub Actions», DOCKER_STANDARD «CI-bygg»).
# Nothing is published or deployed from here: toascribe M0.1 has no server and no registry push.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # a future deploy.yml runs this as its test job (DEPLOYMENT_STRATEGY_2026)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job runs third-party code (dependencies, build)

      # pnpm version comes from `packageManager` in package.json. Must run before setup-node when cache: pnpm is used.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The database tests need a superuser URL on a disposable PostgreSQL 18. The password is made here, per run,
      # masked in the log, and exists nowhere else; no repository secret is involved.
      - name: Start PostgreSQL 18 for the database tests
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          docker run -d --name ci-postgres \
            -e POSTGRES_PASSWORD="${password}" \
            -p 127.0.0.1:5432:5432 \
            postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          # 127.0.0.1, not the socket: the image's temporary init server listens on the socket only.
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker exec ci-postgres pg_isready -h 127.0.0.1 -U postgres
          echo "TEST_DATABASE_URL=postgres://postgres:${password}@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"

      # One command for every check, the same one a developer runs before a push: format, lint, typecheck, test and
      # build for every workspace package and for the root files (eslint, tsc and the `root` Vitest project).
      # TEST_DATABASE_URL comes from the step above, so the database tests run here and none is skipped.
      - name: Check
        run: pnpm check

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f ci-postgres

  images:
    name: Build, scan and start the images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The root package.json version is the repo's single version. Reading it once here, into the job's environment,
      # makes bake (tags), the scans (image-ref) and compose (`up --no-build`) all use the same tag, so a version bump
      # needs no edit in this file. Both bake and compose read TOASCRIBE_VERSION from the environment.
      - name: Read the version
        run: |
          set -euo pipefail
          version="$(jq -er .version package.json)"
          # bash's [[ =~ ]] matches the whole string; grep matches line by line, so a value with a newline in it
          # ("1.0.0\nX=y") would pass grep and then write a second variable into $GITHUB_ENV.
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '${version}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "TOASCRIBE_VERSION=${version}" >> "$GITHUB_ENV"

      # The five images users run: proxy, site, admin, api and postgres (worker and migrate use the api image). The
      # build file is docker/compose.build.yaml, which has the same images as compose.yaml (a test checks that).
      # Nothing is pushed, so there are no provenance or SBOM attestations either; they come with the push step
      # when images are published.
      - name: Build the images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker/compose.build.yaml
          load: true
          push: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # Critical and High with a known fix fail the job (SECURITY_STANDARD_2026 §9). One step per image.
      - name: Scan the api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/toaweb/toascribe-api:${{ env.TOASCRIBE_VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the site image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/toaweb/toascribe-site:${{ env.TOASCRIBE_VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the admin image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/toaweb/toascribe-admin:${{ env.TOASCRIBE_VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the proxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/toaweb/toascribe-proxy:${{ env.TOASCRIBE_VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the postgres image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/toaweb/toascribe-postgres:${{ env.TOASCRIBE_VERSION }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Valkey is not built here (the upstream image, pinned by tag and digest in compose.yaml), but it is part of the
      # stack a user can switch on, so it gets the same scan.
      - name: Scan the valkey image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # The images just built, started as the user starts them: every container healthy, the migrate step done,
      # and the proxy routing as docs/PLAN.md says. compose.yaml stops when a password is empty (there are no
      # default passwords), so give it throwaway ones. They exist only for this run and are masked.
      - name: Make throwaway passwords
        run: |
          for name in POSTGRES_PASSWORD POSTGRES_OWNER_PASSWORD POSTGRES_APP_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done

      - name: Start the stack
        run: docker compose -f docker/compose.yaml up -d --wait --no-build

      - name: Check the routes
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8080"
          check() {
            code="$(curl -s -o /dev/null -w '%{http_code}' "${base}$1")"
            echo "$1 -> ${code}"
            if [ "${code}" != "$2" ]; then
              echo "::error::$1 returned ${code}, expected $2"
              exit 1
            fi
          }
          check / 200
          check /admin 200
          check /setup 308
          check /admin/setup 200
          check /api/health 200
          check /api/ready 200
          # A path that Caddy would route by one reading and forward by another is refused (docker/proxy/Caddyfile).
          check /api/..%2Fadmin 400
          check /api/%2e%2e/admin 400

      - name: Show the container logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs --no-color --tail 80

      - name: Stop the stack
        if: always()
        run: docker compose -f docker/compose.yaml down -v
