# Known vulnerabilities in the production dependencies (SECURITY_STANDARD_2026 §9).
name: Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # a future deploy.yml runs this before it builds
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The documented exceptions in pnpm-workspace.yaml (auditConfig.ignoreGhsas) are not a silent switch-off: they
      # carry a review date, and the job fails when it has passed.
      - name: Check that the audit exceptions are still within their review date
        run: |
          review_by="$(sed -n 's/^# audit-exceptions-review-by: *//p' pnpm-workspace.yaml)"
          if ! printf '%s' "${review_by}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::pnpm-workspace.yaml has no '# audit-exceptions-review-by: YYYY-MM-DD' line"
            exit 1
          fi
          today="$(date -u +%F)"
          if [ "${today}" \> "${review_by}" ]; then
            echo "::error::The audit exceptions in pnpm-workspace.yaml were due for review on ${review_by}. Run 'pnpm audit --prod' and update them."
            exit 1
          fi
          echo "Audit exceptions are due for review on ${review_by}."

      - run: pnpm audit --prod --audit-level high
