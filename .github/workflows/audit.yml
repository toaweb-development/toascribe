# Known vulnerabilities in the production dependencies (SECURITY_STANDARD_2026 §9). The audit before a release is local
# (`pnpm release:check`, scripts/audit.sh); this weekly run catches new advisories in what is already out. Never on push or
# pull request, and nothing else depends on it.
name: Audit

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    # GitHub's runner: a public repo never uses the organisation's own runners (DEPLOYMENT_STRATEGY_2026, «Runnere»).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The review date of the documented exceptions in pnpm-workspace.yaml, then `pnpm audit --prod --audit-level high`.
      - run: scripts/audit.sh
