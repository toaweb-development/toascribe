# Builds every image of docker/compose.build.yaml with provenance and SBOM attestations into a throwaway registry on the
# runner, and scans each one there with the rules of the image gate in ci.yml (Critical and High with a known fix fail).
# Nothing leaves the runner: no login, no credentials, no write access are used here.
#
# Why a local registry: the attestations only exist on an image that is pushed (DOCKER_STANDARD, «CI-bygg»; the docker
# exporter and `load` drop them), and the scan has to happen before the first push to ghcr.io. The scanned manifest list
# is then copied as it is (.github/scripts/copy-images.sh), so what is published is what was scanned.
#
# Used by release.yml (then copies to ghcr.io) and by the dry-run job in ci.yml (then copies to a second local registry).
name: Build and scan the images
description: Build all images with attestations into a local registry on the runner and scan them, without any push

inputs:
  cache-to:
    description: 'Write the layer cache to the GitHub Actions cache (true for the release, false for a pull request).'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The root package.json version the images are tagged with.'
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    # The root package.json version is the repo's single version; compose.build.yaml tags every image with it.
    - name: Read the version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version="$(jq -er .version package.json)"
        # bash's [[ =~ ]] matches the whole string; grep matches line by line (a newline in the value would pass grep).
        if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::package.json version '${version}' is not MAJOR.MINOR.PATCH"
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    # registry:3, pinned by tag and digest. Loopback only; no authentication is needed for a registry that lives for one job.
    - name: Start a throwaway registry
      shell: bash
      run: |
        set -euo pipefail
        docker run -d --name build-registry -p 127.0.0.1:5000:5000 \
          registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
        for _ in $(seq 1 30); do
          curl -fsS http://127.0.0.1:5000/v2/ > /dev/null && exit 0
          sleep 1
        done
        echo "::error::the local registry did not start"
        exit 1

    # network=host so that the builder reaches localhost:5000 (docs.docker.com/build/ci/github-actions/local-registry/).
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: network=host

    # `push: true` pushes to the registry named in the image tags: TOASCRIBE_REGISTRY, here the local one.
    - name: Build the images with attestations
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
      env:
        TOASCRIBE_VERSION: ${{ steps.version.outputs.version }}
        TOASCRIBE_REGISTRY: localhost:5000/toaweb-development
      with:
        source: .
        files: docker/compose.build.yaml
        push: true
        set: |
          *.cache-from=type=gha
          ${{ inputs.cache-to == 'true' && '*.cache-to=type=gha,mode=max' || '' }}
          *.attest=type=provenance,mode=max
          *.attest=type=sbom

    # The same inputs as the scans in ci.yml. Critical and High with a known fix fail the job (SECURITY_STANDARD_2026 §9).
    - name: Scan the api image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: localhost:5000/toaweb-development/toascribe-api:${{ steps.version.outputs.version }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
    - name: Scan the site image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: localhost:5000/toaweb-development/toascribe-site:${{ steps.version.outputs.version }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
    - name: Scan the admin image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: localhost:5000/toaweb-development/toascribe-admin:${{ steps.version.outputs.version }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
    - name: Scan the proxy image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: localhost:5000/toaweb-development/toascribe-proxy:${{ steps.version.outputs.version }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
    - name: Scan the postgres image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: localhost:5000/toaweb-development/toascribe-postgres:${{ steps.version.outputs.version }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
    - name: Scan the mailpit image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: localhost:5000/toaweb-development/toascribe-mailpit:${{ steps.version.outputs.version }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'
