# Dependabot for every ecosystem in the repo (SECURITY_STANDARD_2026 §9). Version updates come once a month, one pull request
# per ecosystem (the group `all` in each), so the local checks run once for the batch. Security updates are not part of these
# groups (`applies-to: version-updates`) and still come as soon as an advisory is out. Dependabot pull requests are proposals:
# no workflow runs on them; check them locally (`pnpm check`, and `pnpm release:check` before a release) before merging.
# Actions are pinned to a commit SHA with the version in a comment; the version updates keep those pins current. Image updates
# are version updates only: the image scan (release.yml, `pnpm release:check`) is the safety net for docker and docker-compose.
version: 2
updates:
  - package-ecosystem: npm # the pnpm workspace, including the catalog in pnpm-workspace.yaml
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # wait a week after a release before proposing it (security updates are not delayed)
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: docker # the Dockerfiles under docker/ (base images pinned by tag and digest)
    directories:
      - /docker/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker-compose # docker/compose.yaml
    directory: /docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      all:
        applies-to: version-updates
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
