# toascribe: the whole stack on one port.
#
#   docker compose -f docker/compose.yaml run --rm --no-deps -T --quiet-build api toa core gen-env >> docker/.env
#   docker compose -f docker/compose.yaml up -d --build
#
# Open http://localhost:8080. Only the proxy publishes a port (the optional, development-only mailpit profile is the one
# exception, on 127.0.0.1); TLS belongs to an external Traefik or nginx that sends all traffic to that port
# (docs/PLAN.md, «Arkitektur»).
#
# Every image has both `image:` and `build:`. Development builds from the repo (`--build`); an installation
# that only has this file and .env pulls the images instead (`docker compose pull && docker compose up -d`).
# Nothing in this file needs a file from the repo at run time: the Caddyfile and the database roles are
# baked into the proxy and postgres images.

name: toascribe

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# DOCKER_STANDARD «Container-herding» and SECURITY §10: least privilege, relaxed per service only where it
# is needed (postgres, valkey).
x-hardened: &hardened
  restart: unless-stopped
  init: true
  logging: *logging
  security_opt:
    - 'no-new-privileges:true'
  cap_drop:
    - ALL

# The one api image runs the api, the worker, the migrate step and the `toa` CLI with different commands.
x-api-image: &api-image
  image: ghcr.io/toaweb-development/toascribe-api:${TOASCRIBE_VERSION:-0.6.0}

# NO VARIABLE HERE IS `:?` (required). Compose reads this whole file for every command, so one required variable would
# stop `docker compose run --rm --no-deps api toa core gen-env >> .env` on a fresh folder, the command that makes the
# secrets. The check is made where the secret is used instead, and a start with a secret missing still stops at once:
#   POSTGRES_PASSWORD, POSTGRES_OWNER_PASSWORD, POSTGRES_APP_PASSWORD  the postgres image's entrypoint (docker/postgres),
#       before the data directory is made; it names the variable
#   TOASCRIBE_ENCRYPTION_KEY, TOASCRIBE_SIGNING_KEY                     the api and the worker, which exit with
#       "Invalid environment: TOASCRIBE_..." (config.ts); the api also refuses two equal keys
#   the two role URLs below: empty when their password is empty, so the api, worker and migrate step exit naming
#       DATABASE_URL or MIGRATION_DATABASE_URL (never a URL with an empty password that would only fail to log in)
# The database roles' passwords sit in URLs, so they must be URL-safe: `openssl rand -hex 32` (see .env.example).
x-database-url: &database-url '${POSTGRES_APP_PASSWORD:+postgres://toascribe_app:${POSTGRES_APP_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-toascribe}}'

services:
  # ── Entry point ──────────────────────────────────────────
  proxy:
    <<: *hardened
    image: ghcr.io/toaweb-development/toascribe-proxy:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: ..
      dockerfile: docker/proxy/Dockerfile
    ports:
      # Loopback by default: only a proxy on this host reaches it. TOASCRIBE_HTTP_BIND=0.0.0.0 exposes it on every interface.
      - '${TOASCRIBE_HTTP_BIND:-127.0.0.1}:${TOASCRIBE_HTTP_PORT:-8080}:8080'
    environment:
      # The one address or network whose X-Forwarded-* headers Caddy believes. Empty: nobody (see the Caddyfile).
      TOASCRIBE_TRUSTED_PROXY: ${TOASCRIBE_TRUSTED_PROXY:-}
      # The largest upload in megabytes (the whole form), for the two routes that take a file; the api has the same cap.
      TOASCRIBE_UPLOAD_MAX_SIZE_MB: ${TOASCRIBE_UPLOAD_MAX_SIZE_MB:-64}
    read_only: true
    tmpfs:
      - /data
      - /config
    networks:
      - edge
      - internal
    depends_on:
      site:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Web apps ─────────────────────────────────────────────
  site:
    <<: *hardened
    image: ghcr.io/toaweb-development/toascribe-site:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: ..
      dockerfile: docker/nuxt/Dockerfile
      args:
        APP: site
        HEALTH_PATH: /
    environment:
      # Where server-side rendering reaches the api (runtimeConfig.apiUrlInternal).
      NUXT_API_URL_INTERNAL: http://api:3001
      # Logs (M1.8, K-297): JSON lines; TOASCRIBE_DEBUG=1 adds debug lines and the stack of an unhandled error (never to visitors).
      NUXT_LOG_LEVEL: ${LOG_LEVEL:-info}
      NUXT_TOASCRIBE_DEBUG: ${TOASCRIBE_DEBUG:-}
      # The shared data cache in Valkey (the `valkey` profile), e.g. redis://valkey:6379. Empty: the site caches in its own memory.
      NUXT_CACHE_VALKEY_URL: ${TOASCRIBE_CACHE_VALKEY_URL:-}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
      - cache
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/',{signal:AbortSignal.timeout(4000),redirect:'manual'}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    <<: *hardened
    image: ghcr.io/toaweb-development/toascribe-admin:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: ..
      dockerfile: docker/nuxt/Dockerfile
      args:
        APP: admin
        HEALTH_PATH: /admin
    environment:
      NUXT_API_URL_INTERNAL: http://api:3001
      # Logs (M1.8, K-297): JSON lines; TOASCRIBE_DEBUG=1 adds debug lines and the stack of an unhandled error (never to visitors).
      NUXT_LOG_LEVEL: ${LOG_LEVEL:-info}
      NUXT_TOASCRIBE_DEBUG: ${TOASCRIBE_DEBUG:-}
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/admin',{signal:AbortSignal.timeout(4000),redirect:'manual'}).then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── API, worker and the migrate step: one image, three commands ──
  api:
    <<: [*hardened, *api-image]
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    command: ['node', 'apps/api/dist/index.js']
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: *database-url
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:${TOASCRIBE_HTTP_PORT:-8080}}
      TOASCRIBE_ENCRYPTION_KEY: ${TOASCRIBE_ENCRYPTION_KEY:-}
      TOASCRIBE_ENCRYPTION_KEY_VERSION: ${TOASCRIBE_ENCRYPTION_KEY_VERSION:-1}
      TOASCRIBE_ENCRYPTION_OLD_KEYS: ${TOASCRIBE_ENCRYPTION_OLD_KEYS:-}
      # Signs the CSRF tokens. Must differ from the encryption key; the api refuses to start if they are equal.
      TOASCRIBE_SIGNING_KEY: ${TOASCRIBE_SIGNING_KEY:-}
      # Only so the api can warn when this is empty and every request comes from one private address (README, «Behind a reverse proxy»).
      TOASCRIBE_TRUSTED_PROXY: ${TOASCRIBE_TRUSTED_PROXY:-}
      # The media library (M1.2): the volume below, and the cap on one upload (the setting upload_max_size_mb stays under it).
      UPLOADS_DIR: /var/lib/toascribe/uploads
      UPLOAD_MAX_SIZE_MB: ${TOASCRIBE_UPLOAD_MAX_SIZE_MB:-64}
      # Where the api asks the site which theme is active (menu locations, «Tilpass»), on the internal network.
      SITE_URL_INTERNAL: http://site:3000
      # Valkey (the `valkey` profile): the embed preview limit is shared by every api process. Empty: each counts alone.
      CACHE_VALKEY_URL: ${TOASCRIBE_CACHE_VALKEY_URL:-}
      # Backups (M1.7): `docker compose exec api toa backup create|list|verify|prune` writes and reads the backups volume.
      BACKUPS_DIR: /var/lib/toascribe/backups
      TOASCRIBE_CONFIG_FILE: /etc/toascribe/toascribe.toml
      # `off`: no update check on this server (M1.7); «Oppdateringer» says so.
      TOASCRIBE_UPDATE_CHECK: ${TOASCRIBE_UPDATE_CHECK:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # `1`: debug lines, and on a 500 the kind of error (never a message or a stack) (M1.8, K-297).
      TOASCRIBE_DEBUG: ${TOASCRIBE_DEBUG:-}
      # Optional OpenTelemetry (M1.8): traces and metrics over OTLP/HTTP to this address. Empty: off, nothing loaded or sent.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads:/var/lib/toascribe/uploads
      - backups:/var/lib/toascribe/backups
      - ${TOASCRIBE_CONFIG_DIR:-config}:/etc/toascribe:ro
    networks:
      - internal
      - db
      - cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'apps/api/dist/healthcheck.js']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    <<: [*hardened, *api-image]
    command: ['node', 'apps/worker/dist/index.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      # Links in e-mails are built from this and nothing else.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:${TOASCRIBE_HTTP_PORT:-8080}}
      TOASCRIBE_ENCRYPTION_KEY: ${TOASCRIBE_ENCRYPTION_KEY:-}
      TOASCRIBE_ENCRYPTION_KEY_VERSION: ${TOASCRIBE_ENCRYPTION_KEY_VERSION:-1}
      TOASCRIBE_ENCRYPTION_OLD_KEYS: ${TOASCRIBE_ENCRYPTION_OLD_KEYS:-}
      # Defaults behind the smtp_* and mail_from_* settings (an empty value counts as unset).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # `1`: debug lines, and on a 500 the kind of error (never a message or a stack) (M1.8, K-297).
      TOASCRIBE_DEBUG: ${TOASCRIBE_DEBUG:-}
      # Optional OpenTelemetry (M1.8): traces and metrics over OTLP/HTTP to this address. Empty: off, nothing loaded or sent.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      WORKER_HEARTBEAT_FILE: /tmp/toascribe-worker.heartbeat
      # The media library (M1.2): the worker reads the originals and writes the sizes.
      UPLOADS_DIR: /var/lib/toascribe/uploads
      # The daily backup (M1.7), when toascribe.toml's [backup] schedule = true.
      BACKUPS_DIR: /var/lib/toascribe/backups
      TOASCRIBE_CONFIG_FILE: /etc/toascribe/toascribe.toml
      # The daily update check (M1.7): a GET of the public image tags on ghcr.io, nothing about the site sent. `off` stops it.
      TOASCRIBE_UPDATE_CHECK: ${TOASCRIBE_UPDATE_CHECK:-}
    read_only: true
    tmpfs:
      - /tmp # the heartbeat file the healthcheck reads
    volumes:
      - uploads:/var/lib/toascribe/uploads
      - backups:/var/lib/toascribe/backups
      - ${TOASCRIBE_CONFIG_DIR:-config}:/etc/toascribe:ro
    # pg-boss waits up to 30 s for running jobs; the worker allows 40 s (apps/worker). Docker must not kill it sooner.
    stop_grace_period: 45s
    networks:
      - internal # the worker needs the internet (SMTP, webhooks), and reaches mailpit when that profile is on
      - db
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/dist/healthcheck.js']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # sharp decodes an image of up to image_max_pixels (100 MP by default: about 300 MB of pixels) in the worker.
          memory: 1G

  # Runs the migrations as the owner role, then exits. It is the only service that gets MIGRATION_DATABASE_URL.
  # It takes an advisory lock, so two of them never migrate at once (packages/db). `toa db migrate` (M1.7, K-293) takes a
  # backup first when a migration is pending on a database that has data, and stops if that fails; it is also where
  # `docker compose run --rm migrate toa backup restore <file>` runs (the owner role, the uploads and the backups).
  migrate:
    <<: *api-image
    command: ['toa', 'db', 'migrate']
    environment:
      MIGRATION_DATABASE_URL: '${POSTGRES_OWNER_PASSWORD:+postgres://toascribe_owner:${POSTGRES_OWNER_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-toascribe}}'
      UPLOADS_DIR: /var/lib/toascribe/uploads
      BACKUPS_DIR: /var/lib/toascribe/backups
      TOASCRIBE_CONFIG_FILE: /etc/toascribe/toascribe.toml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/var/lib/toascribe/uploads
      - backups:/var/lib/toascribe/backups
      - ${TOASCRIBE_CONFIG_DIR:-config}:/etc/toascribe:ro
    restart: 'no'
    init: true
    logging: *logging
    read_only: true
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    networks:
      - db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true # one-shot; the image's HEALTHCHECK is the api's
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Data ─────────────────────────────────────────────────
  postgres:
    restart: unless-stopped
    init: true
    logging: *logging
    image: ghcr.io/toaweb-development/toascribe-postgres:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toascribe}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      # Used once, by 10-init.sh, on the first start of an empty volume. Changing them later changes nothing in
      # the database (ALTER ROLE does that).
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    volumes:
      # PostgreSQL 18 and newer: mount on /var/lib/postgresql, not /var/lib/postgresql/data (POSTGRESQL_STANDARD).
      - postgres_data:/var/lib/postgresql
    # The root filesystem stays writable: the postgres entrypoint needs it. It starts as root, fixes the volume's
    # owner and drops to the postgres user, which is why these five capabilities stay and nothing else.
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - db
    healthcheck:
      # 127.0.0.1, not the socket: during first-start init the temporary server listens on the socket only.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  # Optional shared cache of the site's data (M1.4), for several site instances. Off by default; one instance caches in memory:
  #   docker compose --profile valkey up -d      (or COMPOSE_PROFILES=valkey in .env), with TOASCRIBE_CACHE_VALKEY_URL set
  valkey:
    <<: *hardened
    profiles:
      - valkey
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    # Start as the valkey user (uid 999) so the entrypoint needs no capabilities. A cache: nothing is saved to disk.
    user: '999:1000'
    # A memory cap below the container's limit, and eviction of entries only: they have a lifetime, the tag versions have none. Losing a
    # tag version would turn it back to its first value and make an older entry look current (site-core server/utils/data-cache.ts).
    command:
      [
        'valkey-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '200mb',
        '--maxmemory-policy',
        'volatile-lru',
      ]
    read_only: true
    tmpfs:
      - /data
    # Only the site and the api reach it (the `cache` network: the data cache, and the api's shared limits under `toascribe:api:`);
    # it has no password, so it is on no network the database or the worker share.
    networks:
      - cache
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

  # Development-only mail catcher: every mail the worker sends is kept here and nothing leaves the machine.
  #   docker compose --profile mailpit up -d      (or COMPOSE_PROFILES=mailpit in .env)
  # then set SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_SECURE=none and a MAIL_FROM_ADDRESS in .env (.env.example).
  # The api and worker do not depend on it. Its web UI is published on this machine's loopback only, the one
  # port besides the proxy's; it has no login, so never bind it to another address.
  mailpit:
    <<: *hardened
    profiles:
      - mailpit
    # Mailpit v1.31.6 with its binary rebuilt on a current Go (docker/mailpit/Dockerfile): the official image fails the
    # image scan on a Go standard-library finding.
    image: ghcr.io/toaweb-development/toascribe-mailpit:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: ..
      dockerfile: docker/mailpit/Dockerfile
    # The image runs as root by default; its ports (1025, 8025) need no privilege.
    user: '10001:10001'
    environment:
      # No call to GitHub for a newer version.
      MP_DISABLE_VERSION_CHECK: 'true'
    ports:
      - '127.0.0.1:${TOASCRIBE_MAILPIT_PORT:-8025}:8025'
    read_only: true
    tmpfs:
      - /tmp # Mailpit keeps its mails in a SQLite file here (gone when the container is), and fails to start without it
    networks:
      - internal
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # Where an external Traefik or nginx attaches to reach the proxy (only the proxy is on it). The subnet is fixed
  # so that the address Caddy sees an external proxy at is known: the gateway (.1) for a proxy on the host that
  # connects to the published port, an address in the subnet for a container that joins this network. That is the
  # value for TOASCRIBE_TRUSTED_PROXY (README, «Behind a reverse proxy»). If docker says "Pool overlaps", set another.
  edge:
    ipam:
      config:
        - subnet: ${TOASCRIBE_EDGE_SUBNET:-10.231.97.0/24}
  # The apps talk to each other here.
  internal: {}
  # Postgres lives here and nowhere else. `internal: true`: no route out of the network.
  db:
    internal: true
  # The site and its optional Valkey cache.
  cache:
    internal: true

volumes:
  postgres_data: {}
  # The media library's files (originals and sizes), shared by the api and the worker. Back it up with the database.
  uploads: {}
  # Backups (M1.7): `toa backup create`, the daily backup and the one before a migration. Copy them off the host too.
  backups: {}
  # toascribe.toml at /etc/toascribe ([backup] and later sections). Empty by default (the defaults hold); point
  # TOASCRIBE_CONFIG_DIR at a folder on the host to use your own file.
  config: {}
