# What CI builds (DOCKER_STANDARD «CI-bygg»): image and build, nothing else.
#
#   docker buildx bake -f docker/compose.build.yaml          (from the repo root)
#
# Why a second file: `docker buildx bake` takes a build context from a compose file relative to the directory it is
# run in, not to the file, while compose.yaml's contexts (`..`) are relative to docker/. compose.yaml also needs the
# passwords in its environment just to be read, and building must not. The images, build arguments and Dockerfiles
# here must be the same as in compose.yaml (test/docker-config.test.ts checks that).
#
# TOASCRIBE_REGISTRY is where the images go. The default is where users pull them from. The release workflow builds into a
# throwaway registry on the runner (localhost:5000/toaweb-development), scans the images there, and only then copies them to
# ghcr.io/toaweb-development (.github/workflows/release.yml).
# The label links a package in GitHub's registry to this repository.
name: toascribe

x-labels: &labels
  org.opencontainers.image.source: https://github.com/toaweb-development/toascribe

services:
  proxy:
    image: ${TOASCRIBE_REGISTRY:-ghcr.io/toaweb-development}/toascribe-proxy:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
      labels: *labels

  site:
    image: ${TOASCRIBE_REGISTRY:-ghcr.io/toaweb-development}/toascribe-site:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: .
      dockerfile: docker/nuxt/Dockerfile
      labels: *labels
      args:
        APP: site
        HEALTH_PATH: /

  admin:
    image: ${TOASCRIBE_REGISTRY:-ghcr.io/toaweb-development}/toascribe-admin:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: .
      dockerfile: docker/nuxt/Dockerfile
      labels: *labels
      args:
        APP: admin
        HEALTH_PATH: /admin

  api:
    image: ${TOASCRIBE_REGISTRY:-ghcr.io/toaweb-development}/toascribe-api:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      labels: *labels

  postgres:
    image: ${TOASCRIBE_REGISTRY:-ghcr.io/toaweb-development}/toascribe-postgres:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      labels: *labels

  # Development only (the mailpit profile); built and scanned like the others.
  mailpit:
    image: ${TOASCRIBE_REGISTRY:-ghcr.io/toaweb-development}/toascribe-mailpit:${TOASCRIBE_VERSION:-0.6.0}
    build:
      context: .
      dockerfile: docker/mailpit/Dockerfile
      labels: *labels
